services:
  - type: web
    name: n8n-cloud
    env: docker
    plan: free
    image:
      url: docker.io/n8nio/n8n:latest
    envVars:
      - key: N8N_PORT
        value: 5678
      - key: N8N_HOST
        value: 0.0.0.0
      - key: N8N_PROTOCOL
        value: https
      - key: WEBHOOK_URL
        value: https://n8n-cloud.onrender.com
      - key: GENERIC_TIMEZONE
        value: Africa/Porto-Novo
      - key: N8N_ENCRYPTION_KEY
        value: MaCleSecrete2024 
